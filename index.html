  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Poppins", sans-serif;
      background: linear-gradient(180deg, #ffe0ea, #ffd1e1);
      min-height: 100vh;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      padding-top: 50px;
    }

    .active {
      display: flex;
    }

    h2, h4 {
      color: #ff4d6d;
      text-align: center;
    }

    input {
      padding: 12px 16px;
      border-radius: 20px;
      border: none;
      font-size: 18px;
      margin-bottom: 12px;
      text-align: center;
    }

    button {
      padding: 14px 26px;
      border-radius: 24px;
      border: none;
      background: #ff6b81;
      color: white;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }

    .photo {
      width: 260px;
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(255, 77, 109, 0.25);
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .songs-container {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(14px);
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(255, 77, 109, 0.15);
      overflow: hidden;
      margin-bottom: 60px;
	  margin-top: 10px;
      display: none;
    }

    .songs-container.visible {
      display: block;
    }

    .songs-loader {
      height: 120px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .songs-loader.visible {
      display: flex;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 77, 109, 0.25);
      border-top-color: #ff4d6d;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .songs-list {
      max-height: 440px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .song-item {
      cursor: pointer;
    }

    .song-item iframe {
      pointer-events: none;
      width: 100%;
      height: 80px;
      border: none;
    }

    .iframe-placeholder {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff4d6d;
      font-size: 14px;
      font-weight: 500;
      background: linear-gradient(
        100deg,
        #ffeef3 25%,
        #ffd6e1 37%,
        #ffeef3 63%
      );
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }

    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }

    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .popup-content {
      background: white;
      border-radius: 22px;
      padding: 12px;
      width: 90%;
      max-width: 380px;
    }

    .popup iframe {
      width: 100%;
      height: 352px;
      border-radius: 14px;
      border: none;
    }

    .close {
      position: absolute;
      top: 18px;
      right: 22px;
      font-size: 28px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

  function checkPassword() {
    if (password.value.toLowerCase() === SECRET) {
      localStorage.setItem(KEY, "true");

      screen2.classList.add("active");
    }
  }

  function toggleSongs() {
    const container = document.getElementById("songsContainer");
    const loader = document.getElementById("songsLoader");

    if (container.classList.contains("visible")) {
      container.classList.remove("visible");
      return;
    }

    container.classList.add("visible");
    loader.classList.add("visible");

    setTimeout(() => loader.classList.remove("visible"), 1000);

    if (!songsRendered) {
      renderSongsList();
      songsRendered = true;
    }
  }

  function renderSongsList() {
    const list = document.getElementById("songsList");

    SONGS.slice().reverse().forEach(song => {
      const item = document.createElement("div");
      item.className = "song-item";
      item.dataset.src = song.url;
      item.innerHTML = `<div class="iframe-placeholder">Cargando… 🎶</div>`;
      item.onclick = () => openSong(song.url);
      list.appendChild(item);
      observer.observe(item);
    });
  }

  function playRandomSong() {
    const song = SONGS[Math.floor(Math.random() * SONGS.length)];
    openSong(song.url);
  }

  function openSong(url) {
    popup.style.display = "flex";
    popupContent.innerHTML = `<iframe src="${url}" allow="encrypted-media"></iframe>`;
  }

  function closePopup() {
    popup.style.display = "none";
  }

  const observer = new IntersectionObserver(
    (entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const item = entry.target;
          if (!item.querySelector("iframe")) {
            item.innerHTML = `<iframe src="${item.dataset.src}" allow="encrypted-media"></iframe>`;
          }
          obs.unobserve(item);
        }
      });
    },
    {
      root: document.querySelector(".songs-list"),
      rootMargin: "80px"
    }
  );
